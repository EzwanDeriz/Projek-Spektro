"Path length must be between 0.1 and 10 cm.": "Panjang lintasan harus antara 0.1 dan 10 cm.", "Pop-up blocked. The report was saved as uv1800-report.html. Open it and use Print → Save as PDF.": "Pop-up diblokir. Laporan disimpan sebagai uv1800-report.html. Buka berkasnya lalu gunakan Cetak → Simpan sebagai PDF.", "CSV needs at least two valid numeric rows (x,y).": "CSV memerlukan minimal dua baris numerik yang valid (x,y).", "No data": "Tidak ada data", "Absorbance": "Absorbans", "Transmittance (%)": "Transmitans (%)", "Concentration (mg/L)": "Konsentrasi (mg/L)", "Report": "Laporan", "UV-1700 Virtual Laboratory — Analysis Report": "Laboratorium Virtual UV-1700: Laporan Analisis", "Date": "Tanggal", "Transmittance": "Transmitans", "Path length": "Panjang lintasan", "Quality checks": "Pemeriksaan kualitas", "Unknown A / conc.": "A / konsentrasi sampel tak diketahui", "Calibration curve": "Kurva kalibrasi", "Simulated data. Educational reconstruction; not an official Shimadzu model.": "Data simulasi. Rekonstruksi edukatif; bukan model resmi Shimadzu.", "Troubleshooting": "Pemecahan masalah", "Quiz": "Kuis", "Work instruction (IKA)": "Instruksi kerja alat (IKA)", "UV-1700, Cr(VI) with diphenylcarbazide. Some steps are checked automatically from what you do in the simulator and the others you confirm yourself. Always follow your laboratory's own IKA and the instrument manual.": "UV-1700, Cr(VI) dengan difenilkarbazida. Sebagian langkah diperiksa otomatis dari apa yang Anda lakukan di simulator, sedangkan sisanya Anda konfirmasi sendiri. Selalu ikuti IKA laboratorium Anda dan manual alat.", "I did this": "Sudah saya lakukan", "Reset checklist": "Atur ulang daftar periksa", "Troubleshooting scenarios": "Skenario pemecahan masalah", "A hidden fault changes your readings. Measure as usual, look at the data and find the cause.": "Sebuah gangguan tersembunyi mengubah pembacaan Anda. Ukur seperti biasa, amati datanya, lalu temukan penyebabnya.", "START A RANDOM SCENARIO": "MULAI SKENARIO ACAK", "END SCENARIO": "AKHIRI SKENARIO", "No scenario is active. The simulator is working normally.": "Tidak ada skenario aktif. Simulator bekerja normal.", "Scenario active": "Skenario aktif", "Something affects your readings. Measure the blank, the standards and the sample, then choose the cause.": "Ada hal yang memengaruhi pembacaan Anda. Ukur blanko, standar, dan sampel, lalu pilih penyebabnya.", "CHECK MY DIAGNOSIS": "PERIKSA DIAGNOSIS SAYA", "HINT": "PETUNJUK", "Fix:": "Perbaikan:", "APPLY THE FIX": "TERAPKAN PERBAIKAN", "Not quite. Look at your data again, or ask for a hint.": "Belum tepat. Amati kembali data Anda, atau minta petunjuk.", "Scenario ended.": "Skenario diakhiri.", "Knowledge check": "Uji pemahaman", "Previous": "Sebelumnya", "Next": "Berikutnya", "Reset quiz": "Atur ulang kuis", "Correct.": "Benar.", "Not quite.": "Belum tepat.", "Check the instrument and the cuvettes": "Periksa alat dan kuvet", "Make sure the sample compartment is empty and clean, and that the cuvettes are clean and free of scratches.": "Pastikan kompartemen sampel kosong dan bersih, serta kuvet bersih dan tidak tergores.", "Residue or scratches on the optical faces add absorbance that cannot be corrected later.": "Residu atau goresan pada sisi optik menambah absorbans yang tidak dapat dikoreksi kemudian.", "Open the sample compartment": "Buka kompartemen sampel", "Switch on and initialise": "Nyalakan dan inisialisasi", "Switch on the instrument, start the control software and wait until the self-check has finished.": "Nyalakan alat, jalankan perangkat lunak kendali, lalu tunggu sampai pemeriksaan mandiri selesai.", "During the self-check the instrument tests the lamps and the wavelength drive. Measuring before it ends gives unreliable readings.": "Selama pemeriksaan mandiri, alat menguji lampu dan penggerak panjang gelombang. Mengukur sebelum selesai menghasilkan pembacaan yang tidak andal.", "Show the instrument": "Tampilkan alat", "Warm up the lamp": "Panaskan lampu", "Let the lamp warm up for about 15 minutes before the first reading and follow the manual.": "Biarkan lampu menghangat sekitar 15 menit sebelum pembacaan pertama dan ikuti petunjuk manual.", "The lamp output changes while it heats up, which makes the baseline drift.": "Keluaran lampu berubah selama pemanasan sehingga baseline bergeser.", "Simulate 15 min warm-up": "Simulasikan pemanasan 15 menit", "Prepare blank, standards and sample": "Siapkan blanko, standar, dan sampel", "Prepare the reagent blank, the standards from 0.2 to 1.0 mg/L and the sample. Add the diphenylcarbazide reagent to each and wait for the colour to develop, about 10 minutes or as your method states.": "Siapkan blanko reagen, standar 0.2 sampai 1.0 mg/L, dan sampel. Tambahkan reagen difenilkarbazida pada masing-masing, lalu tunggu warna berkembang sekitar 10 menit atau sesuai metode Anda.", "The red-violet colour must be fully developed, with the same waiting time in every solution.": "Warna merah-ungu harus berkembang sempurna dengan waktu tunggu yang sama pada setiap larutan.", "Set 540 nm and a 1 cm path length": "Atur 540 nm dan panjang lintasan 1 cm", "Set the photometric measurement at 540 nm and use 1 cm cuvettes.": "Atur pengukuran fotometri pada 540 nm dan gunakan kuvet 1 cm.", "540 nm is the absorption maximum of the complex and gives the best sensitivity.": "540 nm adalah serapan maksimum kompleks dan memberikan kepekaan terbaik.", "Open Measurement": "Buka Pengukuran", "Handle and fill the cuvette": "Tangani dan isi kuvet", "Rinse the cuvette with the solution, fill it about three quarters, wipe the clear faces with lint-free tissue and hold it by the frosted sides. Check that there are no bubbles.": "Bilas kuvet dengan larutan, isi sekitar tiga perempat, usap sisi bening dengan tisu bebas serat, dan pegang pada sisi buram. Pastikan tidak ada gelembung.", "Fingerprints and bubbles scatter light and cause errors.": "Sidik jari dan gelembung menghamburkan cahaya dan menimbulkan galat.", "Show the cuvette": "Tampilkan kuvet", "Autozero with the blank": "Autozero dengan blanko", "Put the blank in the beam and run the autozero.": "Letakkan blanko pada jalur berkas dan jalankan autozero.", "It sets the baseline so that the blank reads zero at this wavelength.": "Langkah ini menetapkan baseline sehingga blanko terbaca nol pada panjang gelombang ini.", "Measure the five standards, low to high": "Ukur lima standar, dari rendah ke tinggi", "Measure Standard 1 to 5 in order of increasing concentration, rinse the cuvette between solutions and send each reading to Calibration.": "Ukur Standar 1 sampai 5 dengan urutan konsentrasi naik, bilas kuvet di antara larutan, dan kirim setiap pembacaan ke Kalibrasi.", "Going from low to high concentration keeps carry-over small.": "Urutan dari konsentrasi rendah ke tinggi menjaga pengaruh larutan sebelumnya tetap kecil.", "Check the calibration curve": "Periksa kurva kalibrasi", "Look at R², the recovery of each standard and the absorbance range. Repeat any standard that is off.": "Perhatikan R², perolehan kembali tiap standar, dan rentang absorbans. Ulangi standar yang menyimpang.", "A good curve has R² of about 0.995 or better and recoveries within 90 to 110%.": "Kurva yang baik memiliki R² sekitar 0.995 atau lebih dan perolehan kembali 90 sampai 110%.", "Open Calibration": "Buka Kalibrasi", "Measure the unknown inside the range": "Ukur sampel tak diketahui di dalam rentang", "Measure the sample at 540 nm and send it to Calibration. Its absorbance must lie between the lowest and the highest standard and below 1.0.": "Ukur sampel pada 540 nm dan kirim ke Kalibrasi. Absorbansnya harus berada di antara standar terendah dan tertinggi serta di bawah 1.0.", "Outside the range the result is an extrapolation. Dilute the sample and measure again.": "Di luar rentang, hasilnya merupakan ekstrapolasi. Encerkan sampel lalu ukur ulang.", "Shut down and record": "Matikan alat dan catat", "Remove the cuvettes and rinse them, close the compartment, exit the software, switch off the instrument and write the readings in the logbook.": "Keluarkan dan bilas kuvet, tutup kompartemen, keluar dari perangkat lunak, matikan alat, lalu catat pembacaan pada buku log.", "Clean cuvettes and a clean compartment protect the next measurement.": "Kuvet dan kompartemen yang bersih melindungi pengukuran berikutnya.", "Dirty or fingerprinted cuvette": "Kuvet kotor atau berbekas sidik jari", "Measure the blank after the autozero. What does it read, and what does the intercept check in Calibration say?": "Ukur blanko setelah autozero. Berapa nilai pembacaannya, dan apa kata pemeriksaan intersep di Kalibrasi?", "A fingerprint or residue on the optical faces adds a constant extra absorbance. A constant offset lifts the whole curve (large intercept) and does not change the slope.": "Sidik jari atau residu pada sisi optik menambah absorbans tambahan yang konstan. Offset konstan menggeser seluruh kurva ke atas (intersep besar) dan tidak mengubah gradien.", "Clean the cuvette with lint-free tissue, handle it by the frosted sides, then repeat the autozero and the affected measurements.": "Bersihkan kuvet dengan tisu bebas serat, pegang pada sisi buram, lalu ulangi autozero dan pengukuran yang terdampak.", "Air bubble in the cuvette": "Gelembung udara dalam kuvet", "Measure the same solution three times. Do the readings agree?": "Ukur larutan yang sama tiga kali. Apakah hasilnya sesuai satu sama lain?", "Bubbles scatter light and make the signal jump at random, so repeated readings of the same solution disagree.": "Gelembung menghamburkan cahaya dan membuat sinyal melonjak acak, sehingga pembacaan berulang pada larutan yang sama tidak konsisten.", "Refill the cuvette, tap it gently to release the bubbles, wipe it and measure again.": "Isi ulang kuvet, ketuk perlahan untuk melepaskan gelembung, usap, lalu ukur kembali.", "Lamp not warmed up (baseline drift)": "Lampu belum hangat (baseline bergeser)", "Measure the blank several times in a row. Do the readings stay at zero?": "Ukur blanko beberapa kali berturut-turut. Apakah pembacaan tetap di nol?", "A lamp that has not warmed up changes in intensity, so the baseline moves after the autozero and later readings come out too high.": "Lampu yang belum hangat berubah intensitasnya sehingga baseline bergeser setelah autozero dan pembacaan berikutnya terlalu tinggi.", "Warm up the lamp for about 15 minutes, then repeat the autozero and measure again.": "Panaskan lampu sekitar 15 menit, lalu ulangi autozero dan ukur kembali.", "A standard was prepared incorrectly": "Satu standar dibuat dengan tidak benar", "Measure all five standards and look at the back-calculated recovery of each one in Calibration.": "Ukur kelima standar dan lihat perolehan kembali hasil hitung balik tiap standar di Kalibrasi.", "One standard has a different true concentration than its label, so its point falls off the line and its recovery lies outside 90 to 110%.": "Satu standar memiliki konsentrasi sebenarnya yang berbeda dari labelnya, sehingga titiknya menyimpang dari garis dan perolehan kembalinya di luar 90 sampai 110%.", "Prepare that standard again with a calibrated pipette and measure it again.": "Buat ulang standar tersebut dengan pipet yang terkalibrasi dan ukur kembali.", "Why do you handle a cuvette only by its frosted sides?": "Mengapa kuvet hanya dipegang pada sisi yang buram?", "The frosted sides are thicker and stronger": "Sisi buram lebih tebal dan lebih kuat", "Fingerprints on the clear faces scatter and absorb light and add error": "Sidik jari pada sisi bening menghamburkan dan menyerap cahaya serta menambah galat", "The clear faces are coated and must stay dry": "Sisi bening dilapisi dan harus tetap kering", "It keeps the solution at a stable temperature": "Agar suhu larutan tetap stabil", "The beam passes through the clear faces, so any fingerprint or residue there changes the reading.": "Berkas melewati sisi bening, sehingga sidik jari atau residu di sana mengubah pembacaan.", "What does the autozero with the blank do?": "Apa fungsi autozero dengan blanko?", "It corrects the wavelength scale": "Mengoreksi skala panjang gelombang", "It sets the baseline so that the blank reads A = 0 at the chosen wavelength": "Menetapkan baseline sehingga blanko terbaca A = 0 pada panjang gelombang terpilih", "It converts absorbance into concentration": "Mengubah absorbans menjadi konsentrasi", "It switches the lamp": "Mengganti lampu", "The baseline is stored for one wavelength, so it must be repeated when the wavelength or the cuvette changes.": "Baseline disimpan untuk satu panjang gelombang, sehingga harus diulang saat panjang gelombang atau kuvet berubah.", "At which wavelength is the Cr(VI)-diphenylcarbazide complex measured?": "Pada panjang gelombang berapa kompleks Cr(VI)-difenilkarbazida diukur?", "The complex has its absorption maximum at about 540 nm, which gives the best sensitivity.": "Kompleks memiliki serapan maksimum pada sekitar 540 nm sehingga memberikan kepekaan terbaik.", "Which absorbance range is recommended for calibration standards?": "Rentang absorbans mana yang dianjurkan untuk standar kalibrasi?", "0.001 to 0.01": "0.001 sampai 0.01", "0.1 to 1.0": "0.1 sampai 1.0", "1.5 to 3.0": "1.5 sampai 3.0", "Any value is fine": "Nilai berapa pun boleh", "Below 0.1 the noise is large compared with the signal. Above 1.0 little light reaches the detector and stray light causes negative deviation.": "Di bawah 0.1 derau besar dibandingkan sinyal. Di atas 1.0 sedikit cahaya yang mencapai detektor dan stray light menyebabkan penyimpangan negatif.", "In which order do you measure the standards?": "Dalam urutan apa standar diukur?", "From high to low, without rinsing": "Dari tinggi ke rendah, tanpa membilas", "Random order with an unrinsed cuvette": "Urutan acak dengan kuvet yang tidak dibilas", "From low to high concentration, rinsing between solutions": "Dari konsentrasi rendah ke tinggi, dengan membilas di antara larutan", "Only the highest standard": "Hanya standar tertinggi", "Carry-over from the previous solution matters least when each solution is more concentrated than the one before.": "Pengaruh larutan sebelumnya paling kecil bila setiap larutan lebih pekat daripada sebelumnya.", "The unknown reads A = 1.6, above your highest standard. What do you do?": "Sampel tak diketahui terbaca A = 1.6, di atas standar tertinggi Anda. Apa yang Anda lakukan?", "Extrapolate the calibration line": "Mengekstrapolasi garis kalibrasi", "Dilute the sample, measure again and multiply by the dilution factor": "Mengencerkan sampel, mengukur ulang, lalu mengalikan dengan faktor pengenceran", "Change the wavelength": "Mengganti panjang gelombang", "Report the value as it is": "Melaporkan nilai apa adanya", "The calibration is only valid inside the range of the standards, so the sample must be brought into that range.": "Kalibrasi hanya berlaku di dalam rentang standar, sehingga sampel harus dibawa ke rentang tersebut.", "After the autozero the blank reads A = 0.040 and the intercept is large. What is the most likely cause?": "Setelah autozero, blanko terbaca A = 0.040 dan intersep besar. Apa penyebab yang paling mungkin?", "The lamp is too bright": "Lampu terlalu terang", "A dirty or mismatched cuvette": "Kuvet kotor atau tidak sepasang", "The unknown is too dilute": "Sampel tak diketahui terlalu encer", "The wrong sample name": "Nama sampel salah", "A constant offset points to extra absorbance from the cuvette, such as fingerprints or a mismatch with the cuvette used for the blank.": "Offset konstan menunjukkan absorbans tambahan dari kuvet, seperti sidik jari atau ketidaksesuaian dengan kuvet yang dipakai untuk blanko.", "Readings of the same solution jump around from one repeat to the next. What is the likely cause?": "Pembacaan larutan yang sama melonjak-lonjak dari satu ulangan ke ulangan berikutnya. Apa kemungkinan penyebabnya?", "Air bubbles in the cuvette": "Gelembung udara dalam kuvet", "A perfect calibration curve": "Kurva kalibrasi yang sempurna", "A 1 cm path length": "Panjang lintasan 1 cm", "Lambert-Beer law": "Hukum Lambert-Beer", "Bubbles scatter light at random, so repeated readings disagree. Tap the cuvette gently or refill it.": "Gelembung menghamburkan cahaya secara acak sehingga pembacaan berulang tidak konsisten. Ketuk kuvet perlahan atau isi ulang.", "From which R² is a calibration curve usually accepted?": "Mulai dari R² berapa kurva kalibrasi biasanya diterima?", "About 0.5": "Sekitar 0.5", "About 0.90": "Sekitar 0.90", "About 0.995 or better": "Sekitar 0.995 atau lebih baik", "Above 1.5": "Di atas 1.5", "R² cannot exceed 1. Many methods ask for 0.995 or better, together with recoveries inside 90 to 110%.": "R² tidak mungkin melebihi 1. Banyak metode meminta 0.995 atau lebih baik, bersama perolehan kembali 90 sampai 110%.", "LEARNING MODE (numbered labels)": "MODE PEMBELAJARAN (label bernomor)", "START GUIDED TOUR": "MULAI TUR TERPANDU", "Back": "Kembali", "End": "Selesai", "Key formulas": "Rumus utama", "A = a·b·c (a in L·mg⁻¹·cm⁻¹, c in mg/L) or A = ε·b·c (ε in L·mol⁻¹·cm⁻¹, c in mol/L)": "A = a·b·c (a dalam L·mg⁻¹·cm⁻¹, c dalam mg/L) atau A = ε·b·c (ε dalam L·mol⁻¹·cm⁻¹, c dalam mol/L)", "a = ε / M (M = 51.996 g/mol for Cr)": "a = ε / M (M = 51.996 g/mol untuk Cr)", "Calibration: A = m·c + b → c = (A − b)/m": "Kalibrasi: A = m·c + b → c = (A − b)/m", "Cr(VI) with diphenylcarbazide": "Cr(VI) dengan difenilkarbazida", "In acid solution Cr(VI) oxidizes 1,5-diphenylcarbazide to diphenylcarbazone and is reduced to Cr(III). The Cr(III) then forms a red-violet complex with diphenylcarbazone. The band maximum is at about 540 nm with ε of about 4×10⁴ L·mol⁻¹·cm⁻¹, so a 1.0 mg/L standard gives A of about 0.77 in a 1 cm cuvette. Standards here run from 0.2 to 1.0 mg/L and the blank holds the reagent without Cr(VI).": "Dalam larutan asam, Cr(VI) mengoksidasi 1,5-difenilkarbazida menjadi difenilkarbazon dan tereduksi menjadi Cr(III). Cr(III) kemudian membentuk kompleks merah-ungu dengan difenilkarbazon. Pita maksimum berada pada sekitar 540 nm dengan ε sekitar 4×10⁴ L·mol⁻¹·cm⁻¹, sehingga standar 1.0 mg/L memberikan A sekitar 0.77 pada kuvet 1 cm. Standar di sini berkisar dari 0.2 sampai 1.0 mg/L dan blanko berisi reagen tanpa Cr(VI).", "Source regions (simplified)": "Daerah sumber cahaya (disederhanakan)", "190–400 nm: deuterium; 401–1100 nm: tungsten/halogen. This is an educational simplification, not the instrument's actual switching specification. A flat selector mirror turns by 45° to send the light of the active lamp to the condenser.": "190–400 nm: deuterium; 401–1100 nm: tungsten/halogen. Ini adalah penyederhanaan edukatif, bukan spesifikasi pergantian lampu yang sebenarnya pada alat. Cermin pemilih datar berputar 45° untuk mengarahkan cahaya lampu aktif ke kondensor.", "Educational 3D reconstruction based on available visual references. Internal geometry is simplified for educational visualization and is": "Rekonstruksi 3D edukatif berdasarkan acuan visual yang tersedia. Geometri internal disederhanakan untuk visualisasi pembelajaran dan", "not": "bukan", "an official Shimadzu engineering/CAD model. All measurements are simulated. The sample model is the Cr(VI)–diphenylcarbazide complex (λmax 540 nm, ε ≈ 4×10⁴ L·mol⁻¹·cm⁻¹) drawn as a simplified Gaussian band.": "model teknik/CAD resmi dari Shimadzu. Semua pengukuran bersifat simulasi. Model sampelnya adalah kompleks Cr(VI)-difenilkarbazida (λmaks 540 nm, ε ≈ 4×10⁴ L·mol⁻¹·cm⁻¹) yang digambarkan sebagai pita Gauss yang disederhanakan.", "Calculation": "Perhitungan", "Graph": "Grafik", "Deuterium (UV) and tungsten/halogen (visible) lamps provide continuous radiation.": "Lampu deuterium (UV) dan tungsten/halogen (tampak) menyediakan radiasi kontinu.", "Defines a narrow beam entering the monochromator.": "Menentukan berkas sempit yang masuk ke monokromator.", "Mirrors and grating isolate one wavelength band.": "Cermin dan kisi memisahkan s <h3>Cr(VI) with diphenylcarbazide</h3><div class="box">In acid solution Cr(VI) oxidizes 1,5-diphenylcarbazide to diphenylcarbazone and is reduced to Cr(III). The Cr(III) then forms a red-violet complex with diphenylcarbazone. The band maximum is at about 540 nm with ε of about 4×10⁴ L·mol⁻¹·cm⁻¹, so a 1.0 mg/L standard gives A of about 0.77 in a 1 cm cuvette. Standards here run from 0.2 to 1.0 mg/L and the blank holds the reagent without Cr(VI).</div><h3>Source regions (simplified)</h3><div class="box">190–400 nm: deuterium; 401–1100 nm: tungsten/halogen. This is an educational simplification, not the instrument's actual switching specification. A flat selector mirror turns by 45° to send the light of the active lamp to the condenser.</div>`}
